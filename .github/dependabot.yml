# Weekly, grouped version updates. CI's module hygiene step still rejects any
# update that raises the go directive above the engine's floor.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: chore(deps)
    ignore:
      # hdrhistogram 1.4 changes results for some inputs and needs Go 1.24, so
      # it is upgraded on purpose, in contract, engine and portal-be together.
      - dependency-name: github.com/HdrHistogram/hdrhistogram-go
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
